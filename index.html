<title>THE COACH Manager Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Concepto: cuaderno del cuerpo técnico. Fondo claro tipo papel, paneles blancos, azul marino para la estructura y verde césped sólo para la acción. */
:root{
  --navy:#f3f5f8; --navy-2:#ffffff; --panel:#ffffff; --panel-2:#eef2f6; --line:#dfe4eb; --line-2:#c9d1dc;
  --text:#132033; --muted:#5b6879; --grass:#12804a; --grass-d:#0d6b3d; --amber:#a35d00; --red:#c0392b; --blue:#1f5fbf; --violet:#6d4fc4;
  --ink:#0f2a4a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--navy);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy-2)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:2.1rem;line-height:1.05;text-transform:uppercase}
h2{font-size:1.5rem}
h3{font-size:1.2rem;text-transform:uppercase;letter-spacing:.04em}
h4{font-size:1rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:.9rem}
p{margin:0}
a{color:var(--grass)}
.muted{color:var(--muted)} .small{font-size:.86rem} .note{font-size:.82rem;color:var(--muted);margin-top:.5rem} .note.bad{color:var(--red)}
.sync{font-size:.75rem;color:var(--muted);display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap} .sync::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--grass)} .sync.saving::before{background:var(--amber)} .sync.offline::before,.sync.error::before{background:var(--red)} .sync.offline,.sync.error{color:var(--red)}
.boot{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:.8rem}
@media (max-width:640px){.sync{font-size:0;gap:0}}
.center{text-align:center;justify-content:center}
table,td,th,.num,.score,.kpi b,.rt,.clock{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--grass);outline-offset:2px}

/* Estructura */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--navy-2);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;background:var(--grass);color:#06210f;font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:.02em;clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%)}
.brand-t{display:flex;flex-direction:column;line-height:1}
.brand-t b{font-family:var(--f-display);font-size:1.3rem;letter-spacing:.08em}
.brand-t small{font-size:.7rem;text-transform:uppercase;letter-spacing:.2em;color:var(--grass)}
.brand.big .logo{width:56px;height:56px;font-size:1.7rem}.brand.big .brand-t b{font-size:2rem}
.ctx{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.ctx span{display:flex;flex-direction:column;min-width:0}.ctx b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ctx small{color:var(--muted);font-size:.78rem}
.who{display:flex;align-items:center;gap:10px}
.uname{font-weight:600}
.role{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;padding:3px 7px;border-radius:4px;background:var(--panel-2);color:var(--blue)}
.role.teacher{color:var(--amber)}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100% - 59px)}
.shell.nonav{grid-template-columns:minmax(0,1fr)}
.side{background:var(--navy-2);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto}
.nav-group{margin-bottom:16px}
.nav-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);padding:0 10px 6px}
.side a{display:block;padding:7px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-weight:500}
.side a:hover{background:var(--panel)}
.side a.locked{color:var(--muted)}
.side a.on{background:var(--panel-2);color:var(--grass);box-shadow:inset 3px 0 0 var(--grass)}
.main{padding-block:24px 60px;padding-left:max(16px,min(32px,4vw));padding-right:max(16px,min(32px,4vw));display:flex;flex-direction:column;gap:18px;min-width:0}
.page-head{display:flex;flex-direction:column;gap:6px}
.page-head .link{align-self:flex-start}

/* Componentes */
.card{background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,42,74,.05);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.mine{border-color:var(--grass-d)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-hero{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g-task{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.g-plan{grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr)}
.g-lineup{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}.g-board{grid-template-columns:minmax(0,3fr) minmax(220px,1fr)}
.row{display:flex;gap:10px;align-items:flex-end}.row.wrap{flex-wrap:wrap}.row.end{justify-content:flex-end}.row.center{justify-content:center}
.grow{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--muted)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--grass);border-color:var(--grass);color:#fff}.btn.primary:hover{background:var(--grass-d)}
.btn.ghost{background:transparent}.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.sm{padding:5px 10px;font-size:.85rem}.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon{background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:0 4px;line-height:1}.icon:hover{color:var(--red)}
.link{color:var(--grass);text-decoration:none;font-weight:600;font-size:.9rem}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--panel-2);color:var(--muted);border:1px solid var(--line-2);white-space:nowrap}
.pill.ok{color:var(--grass);border-color:rgba(47,191,113,.4);background:rgba(47,191,113,.1)}
.pill.warn{color:var(--amber);border-color:rgba(245,184,75,.4);background:rgba(245,184,75,.1)}
.pill.bad{color:var(--red);border-color:rgba(239,91,91,.4);background:rgba(239,91,91,.1)}
.pill.info{color:var(--blue);border-color:rgba(90,169,255,.4);background:rgba(90,169,255,.1)}
.pill.pending{color:var(--violet);border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.1)}
.chip{display:inline-block;padding:2px 8px;margin:2px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);font-size:.8rem;color:var(--text);text-decoration:none}
.chip.up{color:var(--grass)}.chip.down{color:var(--red)}
.chips{display:flex;flex-wrap:wrap}
.soon{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--line-2);border-radius:8px;color:var(--muted);font-size:.88rem}
.notice{padding:10px 14px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line-2);font-size:.9rem}
.notice.ok{border-color:rgba(47,191,113,.45)}.notice.warn{border-color:rgba(245,184,75,.45);color:var(--amber)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.18em;color:var(--muted)}
.crest{--s:30px;display:inline-grid;place-items:center;width:var(--s);height:var(--s);flex:none;border-radius:50% 50% 46% 46%/40% 40% 60% 60%;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:700;font-size:calc(var(--s)*.36);letter-spacing:.03em;border:2px solid rgba(255,255,255,.85);text-shadow:0 1px 2px rgba(0,0,0,.4);vertical-align:middle}
.bar{display:inline-block;width:100%;height:7px;border-radius:4px;background:var(--navy);overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.bar.hi i{background:var(--grass)}.bar.mid i{background:var(--blue)}.bar.lo i{background:var(--amber)}.bar.vlo i{background:var(--red)}.bar.warn i{background:var(--amber)}.bar.bad i{background:var(--red)}
.hi{color:var(--grass)}.mid{color:var(--blue)}.lo{color:var(--amber)}.vlo{color:var(--red)}
.score{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1}.score i{font-style:normal;color:var(--muted);font-size:1rem}
.kpis{display:flex;gap:12px;flex-wrap:wrap}.kpis>div{flex:1;min-width:120px;background:var(--navy-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpis small,.kpi small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em}
.kpis b,.kpi b{font-family:var(--f-display);font-size:1.8rem;line-height:1.1}.kpis b i,.kpi b i{font-style:normal;font-size:1rem;color:var(--muted)}.kpis b.sm{font-size:1.1rem}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.kpi{gap:6px}.kpi .pill{align-self:flex-start}.kpi .code{letter-spacing:.15em;color:var(--grass)}

/* Formularios */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field.inline{flex-direction:row;align-items:center;gap:8px}
input,select,textarea{background:var(--navy-2);border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--grass)}
input[type=color]{padding:2px;height:38px;width:70px}
input[type=range]{accent-color:var(--grass);padding:0;border:0;background:none}
textarea{resize:vertical}
select[multiple]{padding:4px}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
select.mini{width:auto;padding:4px 8px;font-size:.85rem}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fields.f3{grid-template-columns:repeat(3,minmax(0,1fr))}.fields.f4{grid-template-columns:repeat(4,minmax(0,1fr))}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.check input{margin-top:3px}
.sticky-actions{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r)}
.sticky{position:sticky;top:80px;align-self:start}
.errs{margin:0;padding-left:18px;color:var(--amber);font-size:.88rem}.ok-t{color:var(--grass)}.warn-t{color:var(--amber)}
.req{font-family:var(--f-body);font-size:.7rem;color:var(--amber);letter-spacing:.1em;margin-left:8px}
.sec-l{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:8px;border-radius:5px;background:var(--grass);color:#fff;font-size:.95rem}
.card.required{border-color:rgba(245,184,75,.45)}
.sec{margin-top:6px}

/* Tablas */
.tablewrap{overflow-x:auto;max-width:100%}
.table{width:100%;border-collapse:collapse;font-size:.9rem}
.table th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr.me td{background:rgba(47,191,113,.08)}
.table tr.click{cursor:pointer}.table tr.click:hover td{background:var(--panel-2)}
.table.compact td,.table.compact th{padding:5px 6px}
.pos{display:inline-block;min-width:38px;text-align:center;padding:2px 5px;border-radius:4px;font-size:.72rem;font-weight:700;background:var(--panel-2)}
.pos.gk{color:var(--amber)}.pos.def{color:var(--blue)}.pos.mid{color:var(--grass)}.pos.att{color:var(--red)}
.rt{display:inline-grid;place-items:center;min-width:34px;padding:3px;border-radius:5px;background:var(--navy-2);font-weight:700}
.fm{display:inline-block;margin-right:3px;padding:0 4px;border-radius:3px;background:var(--panel-2);font-size:.75rem}.fm.hi{color:var(--grass)}.fm.lo{color:var(--red)}
.res{display:inline-block;padding:1px 7px;margin:2px;border-radius:4px;font-size:.78rem;font-weight:700;background:var(--panel-2)}
.res.w{color:var(--grass)}.res.l{color:var(--red)}.res.d{color:var(--amber)}
.round-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.ms{display:flex;flex-wrap:wrap;gap:8px}
.m{padding:6px 10px;border-radius:6px;background:var(--navy-2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:.88rem}
.m.played{border-color:var(--line-2)}.m.played:hover{border-color:var(--grass)}

/* Inicio */
.match-hero{background:linear-gradient(135deg,var(--panel) 0%,var(--panel-2) 100%);align-items:center;text-align:center;gap:14px}
.vs{display:flex;align-items:center;justify-content:center;gap:28px}
.vs-mid{display:flex;flex-direction:column;align-items:center}.vs-mid b{font-family:var(--f-display);font-size:2.4rem;line-height:1}.vs-mid small{color:var(--muted)}
.vs.small .vs-mid b{font-size:1.6rem}
.vs-names{display:flex;justify-content:center;gap:60px;font-family:var(--f-display);font-size:1.3rem;font-weight:600;text-transform:uppercase;flex-wrap:wrap}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.checklist a{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:6px;color:var(--text);text-decoration:none}
.checklist a:hover{background:var(--panel-2)}
.tick{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);font-size:.75rem;color:#fff}
.checklist li.done .tick{background:var(--grass);border-color:var(--grass)}
.last{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.result-line{color:var(--text);text-decoration:none;font-size:1.05rem}.result-line b{color:var(--grass);padding:0 6px}
.ind-list{display:flex;flex-direction:column;gap:6px}
.ind-grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin-top:6px}
.ind{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 64px;gap:10px;align-items:center;font-size:.88rem}
.ibar{position:relative;height:8px;border-radius:4px;background:var(--navy);overflow:hidden}
.ibar i{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:4px}
.ibar em{position:absolute;top:0;bottom:0;background:var(--grass)}.ibar u{position:absolute;top:0;bottom:0;background:var(--red);opacity:.8}
.ind b{text-align:right}.ind b small{margin-left:4px;font-size:.75rem}.up{color:var(--grass)}.down{color:var(--red)}

/* Jugador */
.player-head{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.pcard{width:170px;padding:16px;border-radius:12px;background:linear-gradient(160deg,#21486a,#123a2a);border:1px solid var(--line-2);display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-family:var(--f-display)}
.pc-r{font-size:3rem;font-weight:700;line-height:1}.pc-pos{font-size:1.2rem;color:var(--grass);font-weight:700}
.pcard b{font-size:1.4rem;line-height:1.05;text-transform:uppercase}.pcard small{font-family:var(--f-body);color:var(--muted);font-size:.8rem}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.facts dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.facts dd{margin:0;font-weight:600}
.sw{display:flex;flex-direction:column;gap:8px}.sw h4{margin-top:0}
.gsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.gsum div{background:var(--navy-2);border-radius:6px;padding:6px;text-align:center}.gsum small{display:block;font-size:.7rem;color:var(--muted)}.gsum b{font-family:var(--f-display);font-size:1.4rem}
.attr{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(40px,1fr) 30px;gap:8px;align-items:center;font-size:.86rem}.attr b{text-align:right}
.attr-edit{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:8px;align-items:center;font-size:.86rem}

/* Microciclo */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.day{gap:8px;padding:14px}
.day-head{display:flex;align-items:center;gap:8px;justify-content:space-between}
.day.fixed{justify-content:flex-start}
.match-day{display:grid;place-items:center;flex:1;min-height:120px;border-radius:8px;background:repeating-linear-gradient(90deg,#1d6b3f 0 26px,#1f7445 26px 52px);font-family:var(--f-display);font-size:1.6rem;font-weight:700;letter-spacing:.1em;text-align:center}
.match-day small{display:block;font-family:var(--f-body);font-size:.8rem;letter-spacing:0;font-weight:500}
.day.rest .match-day{background:var(--navy-2);color:var(--muted)}
.load{font-size:.8rem;color:var(--muted)}.load b{color:var(--text)}
.tasks{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.task-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;background:var(--navy-2)}
.task-row a{flex:1;min-width:0;display:flex;flex-direction:column;color:var(--text);text-decoration:none}
.task-row small{color:var(--muted);font-size:.78rem}
.crit{display:flex;flex-direction:column;gap:4px}.crit-h{display:flex;justify-content:space-between;font-size:.9rem}
.loadchart{display:flex;align-items:flex-end;gap:10px;height:110px;padding:8px 0;border-bottom:1px solid var(--line)}
.loadchart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.loadchart i{display:block;width:100%;max-width:42px;background:var(--blue);border-radius:4px 4px 0 0;min-height:3px}
.loadchart i.hi{background:var(--amber)}.loadchart i.match{background:var(--grass)}
.loadchart small{font-size:.72rem;color:var(--muted)}
.tutor ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.lib h4{margin:0;color:var(--text);font-size:1.05rem}
.cond{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;border-radius:6px;background:var(--navy-2);margin-bottom:6px}
.cond select{width:auto;max-width:100%}.cond .num{width:70px}
.conds{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:6px}

/* Campo */
.pitch{width:100%;height:auto;display:block;border-radius:8px;max-width:100%}
.pitch .grass{fill:#1d6b3f}.pitch .stripe{fill:#1f7445}.pitch .lines{stroke:rgba(255,255,255,.8);stroke-width:3}
.tk-n{fill:#fff;font:700 20px var(--f-display)}.tk-n.dark{fill:#0b1220}.tk-l{fill:#fff;font:600 18px var(--f-body);paint-order:stroke;stroke:#0b1a12;stroke-width:4px}
.board{touch-action:none;cursor:crosshair}.board .tok{cursor:grab}
.sh-run{stroke:#f5b84b;stroke-width:4;stroke-dasharray:12 8}.sh-pass{stroke:#fff;stroke-width:4}
.sh-press{fill:rgba(239,91,91,.28);stroke:#ef5b5b;stroke-width:2}.sh-free{fill:rgba(90,169,255,.22);stroke:#5aa9ff;stroke-width:2;stroke-dasharray:8 6}
